name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx streamdeck pack com.mkasjanowicz.ytm-rs.sdPlugin --no-update-check --force -o dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.streamDeckPlugin
